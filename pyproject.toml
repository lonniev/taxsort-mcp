[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxsort-mcp"
version = "0.30.1"
description = "TaxSort — Tollbooth-monetized MCP server for personal tax transaction classification"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "tollbooth-dpyc[nostr]==0.85.1",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.22.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
py-modules = ["server", "config"]
packages = ["tools", "db"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tools", "db", "config"]
omit = ["tests/*", "server.py"]

[tool.coverage.report]
# Floor catches silent erosion back toward an empty suite. Pure-logic modules
# (rules/imports amount+match paths) are the primary net; DB-bound tools raise
# this over time. This is the ONLY place the number lives — pytest-cov reads it
# here, so CI passes --cov flags but never restates the threshold.
fail_under = 20
show_missing = true
skip_covered = false
