name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Same command Deploy Frontend runs. A break here is a break there.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_MCP_URL: /mcp

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The build-and-verify contract every DPYC MCP shares — install the way
      # Horizon installs, lint, prove the entrypoint, run the suite. A composite
      # action, not a reusable workflow, so this job keeps its name and with it the
      # `test` status context branch protection requires.
      - uses: lonniev/dpyc-community/.github/actions/mcp-ci@main
        with:
          test-command: uv run pytest -v --cov=tools --cov=db --cov=config --cov-report=term-missing

