name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Same command Deploy Frontend runs. A break here is a break there.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_MCP_URL: /mcp

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for tollbooth-dpyc on PyPI
        run: |
          REQUIRED=$(grep 'tollbooth-dpyc' pyproject.toml | grep -oP '==\K[0-9.]+')
          if [ -n "$REQUIRED" ]; then
            echo "Waiting for tollbooth-dpyc==$REQUIRED on PyPI..."
            for i in $(seq 1 30); do
              if pip index versions tollbooth-dpyc 2>/dev/null | grep -q "$REQUIRED"; then
                echo "Found tollbooth-dpyc==$REQUIRED on PyPI"
                break
              fi
              echo "Attempt $i/30 — not yet available, waiting 10s..."
              sleep 10
            done
          fi

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      # Exit 5 is "no tests collected" — this repo has no suite yet. Say so
      # loudly rather than swallowing every failure with continue-on-error.
      - name: Run tests
        run: |
          rc=0
          pytest -v || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::warning::No Python tests collected — taxsort-mcp has no test suite."
            exit 0
          fi
          exit $rc
